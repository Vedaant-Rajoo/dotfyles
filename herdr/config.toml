# Herdr config — primary terminal workspace manager (tmux retired).
# Docs: https://herdr.dev/docs/configuration/
onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[ui]
pane_gaps = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
copy_on_select = false
# No left sidebar by default; toggle with prefix+b.
sidebar_start_collapsed = true
sidebar_width = 20
window_title = "{workspace}: {terminal_title}"

# Show Claude's session summary (its terminal title) instead of the agent name.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sound.agents]
claude = "off"

[terminal]
new_cwd = "follow"

[keys]
# ctrl+t prefix, so Neovim keeps ctrl+a. prefix+? shows the live keymap.
prefix = "ctrl+t"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

detach = "prefix+d"
rename_tab = "prefix+comma"
close_tab = "prefix+&"
move_tab_previous = "ctrl+shift+left"
move_tab_next = "ctrl+shift+right"
copy_mode = "prefix+["
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "ctrl+shift+h"]
focus_pane_down = ["prefix+j", "ctrl+shift+j"]
focus_pane_up = ["prefix+k", "ctrl+shift+k"]
focus_pane_right = ["prefix+l", "ctrl+shift+l"]

previous_workspace = ["ctrl+shift+[", "ctrl+{"]
next_workspace = ["ctrl+shift+]", "ctrl+}"]

# Numbered jumps alongside the default switch_tab (prefix+1..9).
switch_workspace = ["prefix+shift+1..9", "ctrl+alt+1..9"]
focus_agent = "prefix+alt+1..9"

split_vertical = ["prefix+|", "prefix+%", "prefix+backslash"]
split_horizontal = ["prefix+minus", 'prefix+"', "prefix+_"]

goto = "prefix+u"
open_notification_target = "prefix+shift+o"

# Fuzzy project → workspace jumper. Also reachable from Fish (Ctrl-o),
# Ghostty (cmd+s), and the CLI.
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "$HOME/.config/bin/herdr-sessionizer"
description = "sessionizer"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'open "$HERDR_ACTIVE_PANE_CWD"'
description = "open folder in Finder"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -n1 herdr pane close'''
description = "close other panes in tab"

# Pane commands run under plain `sh -c` with the brew service's bare launchd
# env, so lazygit goes through login fish to get PATH, EDITOR, and LG_CONFIG_FILE.
[[keys.command]]
key = "prefix+g"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && exec /opt/homebrew/bin/fish -lc "exec lazygit"'
description = "lazygit"

# One-step pane resizing, as in tmux-pain-control.
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = 'herdr pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = 'herdr pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = 'herdr pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = 'herdr pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize right"

[experimental]
pane_history = true
