# version: 1.0.0
"$schema" = "https://starship.rs/config-schema.json"

# Starship's Jetpack preset, with only its colors translated to Rosé Pine.
palette = "rose_pine"

add_newline = true
continuation_prompt = "[▸▹ ](dimmed text)"

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

[fill]
symbol = " "

[character]
format = "$symbol "
success_symbol = "[◎](bold italic gold)"
error_symbol = "[○](italic iris)"
vimcmd_symbol = "[■](italic dimmed pine)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = "pine italic"

[sudo]
format = "[$symbol]($style)"
style = "bold italic iris"
symbol = "⋈┈"
disabled = false

[username]
style_user = "gold bold italic"
style_root = "iris bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "italic foam"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold foam"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold foam)"

[cmd_duration]
format = "[◄ $duration ](italic text)"

[jobs]
format = "[$symbol$number]($style) "
style = "text"
symbol = "[▶](foam italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold iris)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed text"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold pine)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold love"

[[battery.display]]
threshold = 60
style = "italic dimmed iris"

[[battery.display]]
threshold = 70
style = "italic dimmed gold"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic foam)"
style = "italic foam"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = "([▴$added]($added_style))([▿$deleted]($deleted_style))"
added_style = "italic dimmed pine"
deleted_style = "italic dimmed love"
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic foam"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic rose)"
ahead = "[▴│[${count}](bold text)│](italic pine)"
behind = "[▿│[${count}](bold text)│](italic love)"
diverged = "[◇ ▴┤[${ahead_count}](regular text)│▿┤[${behind_count}](regular text)│](italic rose)"
untracked = "[◌◦](italic gold)"
stashed = "[◃◈](italic text)"
modified = "[●◦](italic gold)"
staged = "[▪┤[$count](bold text)│](italic foam)"
renamed = "[◎◦](italic foam)"
deleted = "[✕](italic love)"

[deno]
format = " [deno](italic) [∫ $version](pine bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold gold"

[nodejs]
format = " [node](italic) [◫ ($version)](bold pine)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic) [◫ ($version)](bold pine)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold foam)⌊ "
version_format = "${raw}"
style = "bold gold"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold love"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold love"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed gold italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold love"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold foam"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = "bold italic dimmed foam"
symbol = "✶"
format = "[$symbol nix⎪$state⎪]($style) [$name](italic dimmed text)"
impure_msg = "[⌽](bold dimmed love)"
pure_msg = "[⌾](bold dimmed pine)"
unknown_msg = "[◌](bold dimmed gold)"

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
