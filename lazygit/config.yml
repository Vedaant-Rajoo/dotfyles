# Read through LG_CONFIG_FILE, set in fish/conf.d/10-env.fish; lazygit keeps
# its state.yml in its own macOS config directory.
gui:
  nerdFontsVersion: "3"
  mouseEvents: false
  # Rex's Moss Cathedral theme (rex-themes palette "moss-cathedral").
  theme:
    activeBorderColor:
      - '#8fd48f'
      - bold
    inactiveBorderColor:
      - '#52654f'
    searchingActiveBorderColor:
      - '#cdb35e'
    optionsTextColor:
      - '#8fd48f'
    selectedLineBgColor:
      - '#27402a'
    inactiveViewSelectedLineBgColor:
      - '#1a261b'
    cherryPickedCommitFgColor:
      - '#8fd48f'
    cherryPickedCommitBgColor:
      - '#27402a'
    markedBaseCommitFgColor:
      - '#0f1710'
    markedBaseCommitBgColor:
      - '#cdb35e'
    unstagedChangesColor:
      - '#d4756b'
    defaultFgColor:
      - '#c6d5c2'
    authorColors:
      '*': '#6bb8a0'
git:
  autoFetch: false
  # delta has no Moss Cathedral theme; Catppuccin Mocha is built into delta
  # 0.20. Press | to cycle to git's raw diff.
  diffRenderers:
    - command: delta --dark --paging=never --syntax-theme="Catppuccin Mocha"
      name: delta
    - type: rawGit
      name: default
os:
  # Inside Neovim (snacks' lazygit float), `e` quits lazygit, focuses the window
  # ;g was pressed in, and opens the file there; outside Neovim it runs nvim.
  # The nvim-remote preset keeps lazygit from suspending only inside Neovim.
  editPreset: nvim-remote
  edit: >-
    begin; if test -z "$NVIM"; nvim -- {{filename}};
    else; nvim --server "$NVIM" --remote-send "q<Cmd>lua Newedia.lazygit.focus_origin()<CR>";
    nvim --server "$NVIM" --remote {{filename}}; end; end
