<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#171a1f;--muted:#60666f;--line:#c9c3b8;--accent:#135f63;--accent-ink:#fff;--ok:#27744f;--warn:#9a6418;--risk:#a43e3e;--code:#ebe7de;--focus:#006fdf;--radius:4px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#151719;--panel:#1d2023;--ink:#f3f0e8;--muted:#aeb4bc;--line:#454b52;--accent:#72c6c7;--accent-ink:#102123;--ok:#79c99b;--warn:#e1b467;--risk:#ef9292;--code:#282c30;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}a{color:var(--accent);text-underline-offset:.18em}.skip{position:absolute;left:.75rem;top:-4rem;background:var(--ink);color:var(--bg);padding:.6rem .8rem;z-index:10}.skip:focus{top:.75rem}.shell{max-width:1240px;margin:0 auto;padding:1rem 1rem 4rem}.mast{border-top:6px solid var(--ink);border-bottom:1px solid var(--line);padding:1rem 0 1.15rem}.eyebrow,.meta,.kicker{font:700 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1{font:700 clamp(2rem,5vw,4.5rem)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:.3rem 0 .6rem;max-width:18ch}.summary{font-size:clamp(1rem,2vw,1.25rem);max-width:70ch;margin:0;color:var(--muted)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.statusbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}.stat{padding:.75rem 0}.stat+.stat{padding-left:1rem;border-left:1px solid var(--line)}.stat strong{display:block;font:700 .88rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:.2rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:2rem;align-items:start;margin-top:1.5rem}.content{min-width:0}.toc{position:sticky;top:1rem;border-left:3px solid var(--accent);padding:.2rem 0 .2rem 1rem}.toc h2{font:700 .75rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .6rem}.toc ol{margin:0;padding-left:1.15rem}.toc li{margin:.32rem 0}.toc a{color:var(--muted);text-decoration:none}.toc a:hover{color:var(--accent);text-decoration:underline}.section{border-top:1px solid var(--line);padding:1.5rem 0 1.8rem;scroll-margin-top:1rem}.section:first-child{border-top:0;padding-top:0}.section>h2{font:700 clamp(1.4rem,3vw,2.2rem)/1.1 Georgia,"Times New Roman",serif;margin:0 0 1rem}.section>p:first-of-type{margin-top:0}.lede{font-size:1.08rem;max-width:78ch}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.card{border:1px solid var(--line);background:var(--panel);padding:1rem;border-radius:var(--radius);min-width:0}.card h3{font-size:1rem;margin:0 0 .55rem}.card p:last-child,.card ul:last-child{margin-bottom:0}.step{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}.step-no{font:800 1.3rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}.step h3{margin:0 0 .45rem}.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin:.8rem 0}.mini>div{border-left:2px solid var(--line);padding-left:.65rem;min-width:0}.mini strong{display:block;font:700 .68rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}.table-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;vertical-align:top;padding:.7rem;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{font:700 .72rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--panel) 82%,var(--line))}tr:last-child td{border-bottom:0}code{font:500 .86em/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:.1rem .25rem;border-radius:2px;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:.12rem .45rem;font:700 .68rem/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.risk{color:var(--risk)}ul,ol{padding-left:1.25rem}li+li{margin-top:.35rem}details{border:1px solid var(--line);background:var(--panel);padding:.7rem .85rem;margin:.65rem 0}summary{cursor:pointer;font-weight:700}.empty{color:var(--muted);font-style:italic}.foot{border-top:1px solid var(--line);padding-top:1rem;margin-top:2rem;color:var(--muted);font-size:.84rem}
@media(max-width:820px){.layout{grid-template-columns:1fr}.toc{position:static;order:-1;border-left:0;border-top:3px solid var(--accent);padding:1rem 0}.statusbar{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}.stat:nth-child(4){border-top:1px solid var(--line)}.grid,.mini{grid-template-columns:1fr}.step{grid-template-columns:2.3rem minmax(0,1fr)}}
@media(max-width:480px){.shell{padding-inline:.75rem}.statusbar{grid-template-columns:1fr}.stat+.stat,.stat:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}h1{font-size:2.2rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{body{background:#fff;color:#000}.shell{max-width:none;padding:0}.toc,.skip{display:none}.layout{display:block}.card,.table-wrap,details{break-inside:avoid;background:#fff}.section{break-before:auto}.mast{border-top-color:#000}}
</style>
</head>
<body>
<a class="skip" href="#plan">Skip to plan</a>
<div class="shell">
<header class="mast">
<div class="eyebrow">Technical execution plan</div>
<h1>{{TITLE}}</h1>
<p class="summary">{{SUMMARY}}</p>
</header>
<div class="statusbar" aria-label="Plan metadata">
<div class="stat"><span class="kicker">Status</span><strong>{{STATUS}}</strong></div>
<div class="stat"><span class="kicker">Scope</span><strong>{{SCOPE}}</strong></div>
<div class="stat"><span class="kicker">Risk</span><strong>{{RISK}}</strong></div>
<div class="stat"><span class="kicker">Generated</span><strong>{{GENERATED}}</strong></div>
</div>
<div class="layout">
<main class="content" id="plan">
{{BODY}}
</main>
<nav class="toc" aria-label="Plan sections">
<h2>Contents</h2>
<ol>{{TOC}}</ol>
</nav>
</div>
<footer class="foot">Generated from repository evidence as a self-contained static document.</footer>
</div>
<template id="plan-data">{{PLAN_DATA}}</template>
</body>
</html>
